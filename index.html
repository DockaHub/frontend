<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>manyways</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            season: ['"Season Mix"', '"Playfair Display"', 'serif'],
          },
          colors: {
            manyspace: {
              orange: '#fd6b32',
              gray: {
                border: '#e5e5e5',
                text: '#7f7f7f',
                bg: '#f5f5f5'
              }
            },
            docka: {
              50: '#f8f9fa',
              100: '#f1f3f5',
              200: '#e9ecef',
              300: '#dee2e6',
              400: '#ced4da',
              500: '#adb5bd',
              600: '#868e96',
              700: '#495057',
              800: '#343a40',
              900: '#212529',
              accent: '#fd6b32', // Update accent to ManySpace orange
            }
          }
        }
      }
    }
  </script>
  <style>
    @font-face {
      font-family: 'Season Mix';
      src: url('/fonts/SeasonMix-Regular.woff2') format('woff2'),
           url('/fonts/SeasonMix-Regular.ttf') format('truetype');
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Season Mix';
      src: url('/fonts/SeasonMix-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Drag area for frameless window */
    .app-drag-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      -webkit-app-region: drag;
      z-index: 9999;
      pointer-events: none;
      /* Allows clicks to pass through by default */
    }

    /* Interactive elements should not be draggable */
    button,
    a,
    input,
    [role="button"] {
      -webkit-app-region: no-drag;
      pointer-events: auto;
    }

    /* Custom scrollbar for ultra-minimalist look */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }
  </style>
</head>

<body>
  <div class="app-drag-bar"></div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
